services:
  - type: web
    name: mj-portfolio-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.6
      - key: DB_NAME
        value: MJ-Portfolio
      - key: CORS_ORIGINS
        value: https://your-vercel-app.vercel.app
